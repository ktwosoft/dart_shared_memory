name: dart_shared_memory
version: 0.1.1
description: In-memory key-value stores shared across Dart isolates, with binary values and atomic updates.
homepage: https://github.com/ktwosoft/dart_shared_memory
repository: https://github.com/ktwosoft/dart_shared_memory
issue_tracker: https://github.com/ktwosoft/dart_shared_memory/issues
topics:
  - ffi
  - isolates
  - concurrency
  - shared-memory

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  ffi: ^2.1.0
  code_assets: ^1.2.1
  hooks: ^2.0.2
  native_toolchain_c: ^0.19.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
